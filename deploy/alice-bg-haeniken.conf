        sub_filter '<meta property="og:locale" content="ru_RU">' '<meta property="og:locale" content="en_US">';
        sub_filter '<meta property="og:locale:alternate" content="en_US">' '<meta property="og:locale:alternate" content="ru_RU">';
        sub_filter '<meta name="twitter:description" content="Linux-инфраструктура, распределённые системы, надёжность, безопасность и автоматизация.">' '<meta name="twitter:description" content="Linux infrastructure, distributed systems, reliability, security and automation.">';
        sub_filter '<a class="skip-link" href="#main">К содержанию</a>' '<a class="skip-link" href="#main">Skip to content</a>';
        sub_filter 'aria-label="Основная навигация"' 'aria-label="Primary navigation"';
        sub_filter 'alt="Астроном"' 'alt="Astronomer"';
        sub_filter '"description": "Инженер по эксплуатации и развитию Linux-инфраструктуры, распределённых систем и контейнерных платформ."' '"description": "Engineer focused on Linux infrastructure, distributed systems and container platforms."';
