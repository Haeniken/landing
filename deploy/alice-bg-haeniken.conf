server {
    listen 80;
    listen [::]:80;
    server_name haeniken.com www.haeniken.com;
    server_tokens off;

    root /usr/share/nginx/html/haeniken;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        return 301 https://haeniken.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.haeniken.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/haeniken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haeniken.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:haeniken_www:10m;
    ssl_session_tickets off;

    return 301 https://haeniken.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haeniken.com;
    server_tokens off;

    root /usr/share/nginx/html/haeniken;
    index index.html;
    charset UTF-8;

    ssl_certificate /etc/letsencrypt/live/haeniken.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haeniken.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:haeniken:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/haeniken.com.access.log;
    error_log /var/log/nginx/haeniken.com.error.log warn;

    error_page 404 /errors/404.html;
    error_page 400 401 402 403 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 /errors/4xx.html;
    error_page 500 501 502 503 504 505 506 507 508 510 511 /errors/5xx.html;

    # Redirect only a client-requested index.html. $request_uri is unchanged by
    # Nginx internal redirects, so normal directory index handling cannot loop.
    if ($request_uri ~ ^(.*/)index\.html(?:\?.*)?$) {
        return 301 $1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /errors/404.html { internal; expires -1; }
    location = /errors/4xx.html { internal; expires -1; }
    location = /errors/5xx.html { internal; expires -1; }

    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files $uri =404;
    }

    location = /api/lab/session {
        client_max_body_size 4k;
        proxy_pass http://leaderboard:8080/v1/session;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/lab/leaderboard {
