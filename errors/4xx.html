<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07111f">
  <title>Запрос остановлен — haeniken.com</title>
  <style>
    :root { color-scheme:dark; --ink:#f7faf7; --muted:#8b98a4; --cyan:#73d5da; --red:#ff7657; } *{box-sizing:border-box} html,body{min-height:100%;margin:0} body{display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#132c40,transparent 38%),#06101c;color:var(--ink);font-family:Inter,Arial,sans-serif} main{width:min(900px,100%);padding:clamp(28px,8vw,100px);text-align:center} .gate{position:relative;width:min(62vw,310px);aspect-ratio:1;margin:0 auto 42px;border:1px solid rgba(115,213,218,.24);border-radius:50%;box-shadow:inset 0 0 55px rgba(115,213,218,.07)} .gate::before,.gate::after{content:"";position:absolute;inset:16%;border:1px dashed rgba(115,213,218,.3);border-radius:50%;animation:turn 18s linear infinite}.gate::after{inset:34%;border-style:solid;border-color:var(--red);box-shadow:0 0 25px rgba(255,118,87,.28);animation-direction:reverse}.gate strong{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);color:var(--red);font:800 clamp(38px,8vw,76px)/1 ui-monospace,monospace;letter-spacing:-.09em} .kicker{color:var(--red);font:700 10px/1.3 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase} h1{margin:18px 0;font-size:clamp(42px,7vw,84px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase} p{max-width:610px;margin:0 auto;color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.6} a{min-height:50px;display:inline-flex;align-items:center;margin-top:32px;padding:0 24px;background:var(--red);color:#07111f;font:800 11px/1 ui-monospace,monospace;letter-spacing:.11em;text-decoration:none;text-transform:uppercase;transition:.2s ease} a:hover,a:focus-visible{transform:translateY(-2px);box-shadow:0 0 28px rgba(255,118,87,.35);outline:none}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
  <style>
    .gate .node { position:absolute; z-index:2; width:14px; height:14px; border:3px solid #06101c; border-radius:50%; background:var(--cyan); box-shadow:0 0 16px var(--cyan); }
    .gate .node.one { left:7%; top:28%; }.gate .node.two { right:3%; top:55%; }.gate .node.three { left:35%; bottom:-1%; background:var(--red); box-shadow:0 0 16px var(--red); }
    .gate .beam { position:absolute; top:50%; left:50%; width:50%; height:1px; transform-origin:0 50%; background:linear-gradient(90deg,rgba(115,213,218,.05),rgba(115,213,218,.42)); }
    .gate .beam.one { transform:rotate(194deg) }.gate .beam.two { transform:rotate(-28deg) }.gate .beam.three { transform:rotate(108deg) }
    .gate .beam::after { content:""; position:absolute; right:12%; top:-2px; width:5px; height:5px; border-radius:50%; background:#d9feff; box-shadow:0 0 11px var(--cyan); animation:packet 2.6s ease-in-out infinite; }
    .gate .beam.two::after { animation-delay:-.8s }.gate .beam.three::after { animation-delay:-1.6s }
    @keyframes packet { from { right:92%; opacity:0 } 20%,80% { opacity:1 } to { right:8%; opacity:0 } }
  </style>
</head>
<body><main><div class="gate" aria-hidden="true"><i class="beam one"></i><i class="beam two"></i><i class="beam three"></i><i class="node one"></i><i class="node two"></i><i class="node three"></i><strong>4××</strong></div><div class="kicker">CLIENT / REQUEST REJECTED</div><h1>Запрос остановлен</h1><p>Сервер понял маршрут, но не может выполнить этот запрос. Проверьте адрес или вернитесь к доступному разделу.</p><a href="/">Вернуться в профиль →</a></main></body>
</html>
