<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07111f">
  <title>404 — маршрут вне орбиты</title>
  <style>
    :root { color-scheme: dark; --ink:#f7faf7; --muted:#83909c; --line:rgba(133,220,226,.2); --cyan:#73d5da; --red:#ff7657; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { display:grid; place-items:center; overflow:hidden; background:radial-gradient(circle at 70% 20%,#132b3e 0,transparent 32%),#06101c; color:var(--ink); font-family:Inter,Arial,sans-serif; }
    body::before { content:""; position:fixed; inset:0; opacity:.28; background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px); background-size:73px 73px; }
    main { position:relative; z-index:1; width:min(1080px,100%); min-height:100svh; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:clamp(28px,7vw,100px); padding:clamp(28px,7vw,96px); }
    .copy { max-width:570px; }
    .signal { display:flex; align-items:center; gap:10px; color:var(--red); font:700 11px/1.2 ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .signal::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 18px var(--red); animation:pulse 1.8s ease-in-out infinite; }
    h1 { margin:24px 0 22px; font-size:clamp(62px,10vw,150px); line-height:.76; letter-spacing:-.075em; text-transform:uppercase; }
    h1 span { display:block; color:transparent; -webkit-text-stroke:1px rgba(247,250,247,.45); }
    p { max-width:520px; margin:0; color:var(--muted); font-size:clamp(16px,2vw,21px); line-height:1.6; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; }
    a { min-height:50px; display:inline-flex; align-items:center; padding:0 22px; border:1px solid var(--line); color:var(--ink); font:700 11px/1 ui-monospace,monospace; letter-spacing:.1em; text-decoration:none; text-transform:uppercase; transition:.2s ease; }
    a:first-child { border-color:var(--red); background:var(--red); color:#07111f; }
    a:hover,a:focus-visible { transform:translateY(-2px); box-shadow:0 0 24px rgba(115,213,218,.2); outline:none; }
    .orbit { position:relative; aspect-ratio:1; width:min(42vw,460px); justify-self:center; border:1px solid rgba(115,213,218,.22); border-radius:50%; animation:turn 24s linear infinite; }
    .orbit::before,.orbit::after { content:""; position:absolute; border:1px solid rgba(115,213,218,.17); border-radius:50%; }
    .orbit::before { inset:17%; }
    .orbit::after { inset:36%; background:#07111f; box-shadow:0 0 50px rgba(115,213,218,.13); }
    .node { position:absolute; width:16px; height:16px; border:3px solid #06101c; border-radius:50%; background:var(--cyan); box-shadow:0 0 15px var(--cyan); }
    .node.one { left:9%; top:24%; }.node.two { right:3%; top:47%; }.node.three { left:31%; bottom:-1%; background:var(--red); box-shadow:0 0 15px var(--red); }
    .code { position:absolute; z-index:2; inset:50% auto auto 50%; transform:translate(-50%,-50%) rotate(0); color:var(--red); font:800 clamp(34px,6vw,68px)/1 ui-monospace,monospace; letter-spacing:-.08em; animation:counterturn 24s linear infinite; }
    .coordinate { position:absolute; right:0; bottom:0; color:rgba(247,250,247,.35); font:9px/1.5 ui-monospace,monospace; letter-spacing:.12em; }
    @keyframes turn { to { transform:rotate(360deg); } } @keyframes counterturn { to { transform:translate(-50%,-50%) rotate(-360deg); } } @keyframes pulse { 50% { opacity:.35; transform:scale(.7); } }
    @media (max-width:760px) { main { grid-template-columns:1fr; align-content:center; }.orbit { order:-1; width:min(68vw,300px); }.coordinate { display:none; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="signal">HTTP 404 · объект не найден</div>
      <h1>Маршрут<span>вне орбиты</span></h1>
      <p>Запрошенной точки нет в карте сайта. Возможно, адрес изменился или в ссылке потерялась координата.</p>
      <nav aria-label="Доступные маршруты"><a href="/">Вернуться в профиль →</a><a href="/lab/">Открыть лабораторию</a></nav>
    </section>
    <div class="orbit" aria-hidden="true"><i class="node one"></i><i class="node two"></i><i class="node three"></i><strong class="code">404</strong></div>
    <div class="coordinate">HAENIKEN.COM / ROUTE_NOT_FOUND</div>
  </main>
</body>
</html>
